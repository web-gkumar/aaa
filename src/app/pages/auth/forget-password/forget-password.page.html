<ion-content [fullscreen]="true">
  <div class="auth-card">
    <h2>Reset Password</h2>
    <p>Enter your email to reset your password 🌱</p>
  </div>
  <form [formGroup]="resetForm" class="formgroup">
    <div class="inputfield"><input type="text" placeholder="Email" formControlName="email"></div>
    <div class="inputfield"><input type="button" value="Reset Password"></div>
    <p style="text-align:center;">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</ion-content>
