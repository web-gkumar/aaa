<ion-content [fullscreen]="true">
 <div class="auth-card">
    <h2>🌾 Welcome Back</h2>
    <p>Login to continue 🌱</p>
  </div>
  <form [formGroup]="loginForm" class="formgroup">
    <div class="inputfield"><input type="text" placeholder="Mobile" formControlName="mobile"></div>
    <div class="inputfield"><input type="password" placeholder="Password" formControlName="password"></div>
    <div style="text-align:right;"><a routerLink="/forget-password">Forgot Password? </a></div>
    <div class="inputfield"><input type="button" value="Login" (click)="login()"></div>
  <div style="text-align:center;"><span style="margin-right:5px;">Don't have an account?</span> <a routerLink="/register">Register</a></div>
  </form>
  
  

</ion-content>
