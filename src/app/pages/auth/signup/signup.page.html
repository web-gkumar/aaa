<ion-content [fullscreen]="true">
  <div class="auth-card">
    <h2>Create Account</h2>
    <p>Join our farming community 🌱</p>
  </div>
  <form [formGroup]="signupForm" class="formgroup">
    <div class="inputfield"><input type="text" placeholder="Name" formControlName="name"></div>
    <div class="inputfield"><input type="text" placeholder="Email" formControlName="email"></div>
    <div class="inputfield"><input type="text" placeholder="Mobile" formControlName="mobile"></div>
    <div class="inputfield"><input type="text" placeholder="Password" formControlName="password"></div>
    <div class="inputfield"><input type="button" value="Register" (click)="onSubmit()"></div>
    <p style="text-align:center;">Already have an account? <a routerLink="/login">Login</a></p>
  </form>
</ion-content>
